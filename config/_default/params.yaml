# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

i_am_a_sponsor: true

# Appearance

appearance:
  theme_day: custom
  theme_night:
  font: roboto
  #font_size: S
  font_size: M
  #fotn_size: L

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    #description: 'A highly-customizable Hugo academic resume theme powered by Wowchemy website builder.'
    description: 'Jiadong Dan — Eric and Wendy Schmidt AI in Science Fellow at NUS. Machine learning for atomic-resolution electron microscopy and disordered materials.'
    twitter: 'jiadong_dan'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
  verification:
    google: 'jHh6Pg1fkrsoaae4E1u25cxmUqN7TJctKdbiAJSOBHM'
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: true

# Site footer

footer:
  copyright:
    notice: '© {year} Jiadong Dan. Published with Hugo.🤖'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula
  math:
    # Disabled: no page uses math, and MathJax is ~1.16 MB (47% of homepage weight).
    # Enable per-page only if a formula is needed.
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/jiadongdan/jiadongdan.github.io'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    # Built-in client-side search (Fuse.js over the generated index.json).
    # The theme's navbar shows a search icon when `provider` is set and
    # `header.navbar.show_search` is true; the modal opens on `/` and closes
    # on ESC. Only "wowchemy" and "algolia" are supported by blox-bootstrap
    # v5.9.6 -- Pagefind is NOT integrated in this version, which is why the
    # Pagefind index the CI used to build was never consumed by anything.
    provider: 'wowchemy'
    wowchemy:
      min_length: 1
      threshold: 0.3
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: ''
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006
  #citation_style: mla
  citation_style: apa
